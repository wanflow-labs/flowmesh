[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # paste is a compile-time proc macro that does not run in the shipped binary; this is an "unmaintained" notice, not a vulnerability.
    # Pulled in by tun-rs → netlink-packet-core. Revisit when tun-rs drops it.
    { id = "RUSTSEC-2024-0436", reason = "paste: build-time proc macro via tun-rs, unmaintained notice only; revisit when tun-rs drops it" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
deny = [
    { name = "tailscale" },
    { name = "tailscale-client" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
