[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
deny = [
    { name = "tailscale" },
    { name = "tailscale-client" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
