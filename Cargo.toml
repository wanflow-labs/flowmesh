[workspace]
resolver = "3"
members = ["xtask", "crates/*"]
# The fuzz targets build with nightly and libFuzzer in their own workspace (make fuzz).
exclude = ["fuzz"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/wanflow-labs/flowmesh"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Release binaries: one codegen unit and LTO for deterministic, compact output.
[profile.release]
codegen-units = 1
lto = "fat"
strip = true
