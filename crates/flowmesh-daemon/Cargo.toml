[package]
name = "flowmesh-daemon"
description = "flowmesh daemon (flowmeshd): preferences, backend state machine, local API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
flowmesh-engine = { version = "0.1.0", path = "../flowmesh-engine" }
flowmesh-meshsvc = { version = "0.1.0", path = "../flowmesh-meshsvc" }
flowmesh-state = { version = "0.1.0", path = "../flowmesh-state" }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
ipnet = { version = "2.12.2", features = ["serde"] }
nix = { version = "0.31.3", default-features = false, features = ["user"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }

[[bin]]
name = "flowmeshd"
path = "src/main.rs"

[dev-dependencies]
bytes = "1.12.1"
nix = { version = "0.31.3", default-features = false, features = ["user"] }
flowmesh-proto = { path = "../flowmesh-proto" }
http-body-util = "0.1.5"
hyper = "1.12.0"
