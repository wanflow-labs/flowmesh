[package]
name = "flowmesh-cli"
description = "flowmesh command-line client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "flowmesh"
path = "src/main.rs"

[dependencies]
# Only the client and preference types; the daemon's features (SSH) stay out of the CLI.
flowmesh-daemon = { version = "0.1.0", path = "../flowmesh-daemon", default-features = false }
flowmesh-proto = { version = "0.1.0", path = "../flowmesh-proto" }
flowmesh-stun = { version = "0.1.0", path = "../flowmesh-stun" }
getrandom = "0.3"
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
ipnet = "2.12.2"
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt", "macros", "time", "net", "io-std", "io-util"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt", "macros"] }
