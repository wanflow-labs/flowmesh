[package]
name = "flowmesh-ssh"
description = "flowmesh's SSH server: identity from the mesh, access from the control server's SSH policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
flowmesh-proto = { version = "0.1.0", path = "../flowmesh-proto" }
flowmesh-net = { version = "0.1.0", path = "../flowmesh-net" }
russh = { version = "0.63.1", default-features = false, features = ["ring"] }
rand = "0.10"
bytes = "1.12.1"
getrandom = "0.3"
russh-sftp = "3.0.1"
rustix = { version = "1.1.5", features = ["termios", "process"] }
nix = { version = "0.31.3", default-features = false, features = ["user", "term", "process", "signal", "fs", "socket", "ioctl", "net"] }
tokio = { version = "1.53.2", features = ["net", "rt", "sync", "io-util", "io-std", "fs", "process", "time", "macros"] }

[dev-dependencies]
serde_json = "1.0.151"
