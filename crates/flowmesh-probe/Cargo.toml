[package]
name = "flowmesh-probe"
description = "flowmesh protocol probe: register with a control server and record raw messages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
flowmesh-control = { version = "0.1.0", path = "../flowmesh-control" }
flowmesh-proto = { version = "0.1.0", path = "../flowmesh-proto" }
flowmesh-state = { version = "0.1.0", path = "../flowmesh-state" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time"] }
