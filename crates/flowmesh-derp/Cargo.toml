[package]
name = "flowmesh-derp"
description = "flowmesh DERP relay client: framing, handshake and TLS transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
crypto_box = { version = "0.9.1", features = ["std", "salsa20"] }
flowmesh-proto = { version = "0.1.0", path = "../flowmesh-proto" }
getrandom = "0.3"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.4"
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["net", "io-util", "time", "sync", "rt", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
