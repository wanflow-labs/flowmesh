[package]
name = "flowmesh-engine"
description = "flowmesh network engine: control, DERP, direct paths, WireGuard, TUN, MagicDNS (Linux)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["ssh"]
# The SSH server (--ssh); off for builds where size matters (CPE).
ssh = ["dep:flowmesh-ssh"]

[dependencies]
flowmesh-control = { version = "0.1.0", path = "../flowmesh-control" }
flowmesh-dataplane = { version = "0.1.0", path = "../flowmesh-dataplane" }
flowmesh-derp = { version = "0.1.0", path = "../flowmesh-derp" }
flowmesh-disco = { version = "0.1.0", path = "../flowmesh-disco" }
flowmesh-dns = { version = "0.1.0", path = "../flowmesh-dns" }
flowmesh-filter = { version = "0.1.0", path = "../flowmesh-filter" }
flowmesh-udprelay = { version = "0.1.0", path = "../flowmesh-udprelay" }
flowmesh-net = { version = "0.1.0", path = "../flowmesh-net" }
flowmesh-netcfg = { version = "0.1.0", path = "../flowmesh-netcfg" }
flowmesh-pathsock = { version = "0.1.0", path = "../flowmesh-pathsock" }
flowmesh-proto = { version = "0.1.0", path = "../flowmesh-proto" }
flowmesh-ssh = { version = "0.1.0", path = "../flowmesh-ssh", optional = true }
flowmesh-serve = { version = "0.1.0", path = "../flowmesh-serve" }
flowmesh-state = { version = "0.1.0", path = "../flowmesh-state" }
flowmesh-stun = { version = "0.1.0", path = "../flowmesh-stun" }
base64 = "0.23.1"
bytes = "1.12.1"
getrandom = "0.3"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
ipnet = "2.12.2"
# 64-bit atomics on every target: 32-bit MIPS has none in hardware (OpenWrt routers).
portable-atomic = { version = "1.15.0", features = ["fallback"] }
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync", "process", "net", "signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
tun-rs = { version = "2.8.11", features = ["async_tokio"] }
nix = { version = "0.31.3", default-features = false, features = ["socket", "uio", "net"] }

[dev-dependencies]
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
tokio = { version = "1.53.2", features = ["test-util", "macros", "rt"] }
