[package]
name = "flowmesh-dev"
description = "flowmesh development daemon: control + DERP + userspace WireGuard + TUN (Linux only, not a release artifact)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
flowmesh-engine = { version = "0.1.0", path = "../flowmesh-engine" }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "signal"] }
