[package]
name = "flowmesh-dataplane"
description = "flowmesh userspace data plane: WireGuard sessions per peer, routing and filtering"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
boringtun = { version = "0.7", default-features = false }
flowmesh-filter = { version = "0.1.0", path = "../flowmesh-filter" }
flowmesh-proto = { version = "0.1.0", path = "../flowmesh-proto" }
ipnet = "2.12.2"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
