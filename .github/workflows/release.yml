# SPDX-License-Identifier: Apache-2.0
# Release: a tag vX.Y.Z builds the release twice — on the runner with build/setup-toolchain.sh, and in
# the pinned container (build/Dockerfile) — and publishes only if both produce the same bytes
# (docs/reproducible-builds.md). Run by hand (workflow_dispatch) it builds and compares, and does not
# publish. The `openwrt` job turns the runner's build into the signed OpenWrt package feed
# (packaging/openwrt/build-feed.sh) with the keys in the secrets OPENWRT_USIGN_KEY and OPENWRT_APK_KEY;
# signatures are not reproducible, so the feed is not part of the comparison (its packages are built
# from the compared tarballs).
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: The tag names the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, but Cargo.toml says $v"; exit 1; }
      - run: bash build/setup-toolchain.sh
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm
      - name: Build, package
        run: |
          export PATH="$HOME/.local/zig-0.13.0:$HOME/.cargo/bin:$PATH"
          build/release.sh dist
          build/package.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  reproduce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build in the pinned container
        run: |
          mkdir -p build/cache
          docker build -q -f build/Dockerfile -t flowmesh-build:ci build
          # The container's builder user writes into the checkout.
          chmod -R a+rwX .
          docker run --rm -v "$PWD":/flowmesh -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            flowmesh-build:ci build/release.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-container
          path: dist/SHA256SUMS

  openwrt:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Tools (apk-tools 3.0.5, usign, po2lmo; pinned sources, SHA-256 checked)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq meson ninja-build pkg-config libssl-dev zlib1g-dev
          t=$RUNNER_TEMP/tools
          packaging/openwrt/tools/build-apk-tools.sh "$t"
          packaging/openwrt/tools/build-usign.sh "$t"
          packaging/openwrt/tools/build-po2lmo.sh "$t"
      - name: Packages
        run: |
          # build-packages.sh runs `apk mkpkg` in an unprivileged user namespace (unshare -r) so that
          # files are recorded as root's; Ubuntu 24.04 runners forbid those by default (AppArmor).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          t=$RUNNER_TEMP/tools
          APK=$t/apk PO2LMO=$t/po2lmo packaging/openwrt/build-packages.sh dist pkgs
      - name: Signed feed
        env:
          OPENWRT_USIGN_KEY: ${{ secrets.OPENWRT_USIGN_KEY }}
          OPENWRT_APK_KEY: ${{ secrets.OPENWRT_APK_KEY }}
        run: |
          [ -n "$OPENWRT_USIGN_KEY" ] && [ -n "$OPENWRT_APK_KEY" ] ||
            { echo "the secrets OPENWRT_USIGN_KEY and OPENWRT_APK_KEY must be set"; exit 1; }
          keys=$(mktemp -d)
          trap 'rm -rf "$keys"' EXIT
          (umask 077; printf '%s\n' "$OPENWRT_USIGN_KEY" > "$keys/usign.sec"; printf '%s\n' "$OPENWRT_APK_KEY" > "$keys/apk.key")
          t=$RUNNER_TEMP/tools
          USIGN=$t/usign APK=$t/apk USIGN_KEY=$keys/usign.sec APK_KEY=$keys/apk.key \
            packaging/openwrt/build-feed.sh pkgs feed
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-feed
          path: feed/

  publish:
    # A tagged release ships with its matching OpenWrt feed, never without one: a missing or wrong
    # OPENWRT_* secret, or a failing tool build in `openwrt`, blocks the release until it is fixed.
    needs: [build, reproduce, openwrt]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: dist-container
          path: dist-container
      - uses: actions/download-artifact@v4
        with:
          name: openwrt-feed
          path: feed
      - name: Both builders produced the same bytes
        run: |
          # The container build has no packages; every file it did build must match.
          n=0
          while read -r sum file; do
            grep -qx "$sum  $file" dist/SHA256SUMS || { echo "differs: $file"; exit 1; }
            n=$((n + 1))
          done < dist-container/SHA256SUMS
          [ "$n" -ge 10 ] || { echo "only $n files compared"; exit 1; }
          echo "identical: $n files"
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          cp packaging/install.sh dist/install.sh
          cp "feed/flowmesh-openwrt-feed-$v.tar.gz" dist/
          cd dist
          # Mirrors (packaging/mirror-sync.sh) check install.sh and the feed against this list too.
          sha256sum install.sh "flowmesh-openwrt-feed-$v.tar.gz" >> SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "FlowMesh $v" --notes-from-tag \
            flowmesh-*.tar.gz *.deb *.rpm *.cdx.json SHA256SUMS install.sh

  oss:
    # Copies the published release to the OSS bucket behind the download mirror (packaging/
    # oss-publish.sh). Skipped until the repository variables below are set; a failure here does not
    # touch the GitHub Release, and re-running this job publishes the same files again.
    #   OSS_BUCKET, OSS_REGION (e.g. cn-hangzhou), OSS_ROLE_ARN, OSS_OIDC_PROVIDER_ARN
    # The RAM role trusts this repository's tag refs only (OIDC subject repo:<owner>/<repo>:ref:refs/tags/*).
    needs: publish
    if: startsWith(github.ref, 'refs/tags/') && vars.OSS_BUCKET != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: ossutil 2.4.0 (SHA-256 checked)
        run: |
          zip=ossutil-2.4.0-linux-amd64.zip
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$zip" "https://gosspublic.alicdn.com/ossutil/v2/2.4.0/$zip"
          echo "85edf66b2fb7238f5c7e25cab820cf29312319fe4935b7c86a6b8485eb434f3c  $RUNNER_TEMP/$zip" | sha256sum -c --quiet -
          unzip -q -o "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP"
          install -m0755 "$RUNNER_TEMP/ossutil-2.4.0-linux-amd64/ossutil" "$RUNNER_TEMP/ossutil"
      - name: The published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" -D rel
      - name: Temporary credentials (OIDC)
        id: cred
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1.1.0
        with:
          role-to-assume: ${{ vars.OSS_ROLE_ARN }}
          oidc-provider-arn: ${{ vars.OSS_OIDC_PROVIDER_ARN }}
          role-session-name: flowmesh-release-${{ github.run_id }}
      - name: Upload
        env:
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_REGION: ${{ vars.OSS_REGION }}
          OSS_ACCESS_KEY_ID: ${{ steps.cred.outputs.aliyun-access-key-id }}
          OSS_ACCESS_KEY_SECRET: ${{ steps.cred.outputs.aliyun-access-key-secret }}
          OSS_SESSION_TOKEN: ${{ steps.cred.outputs.aliyun-security-token }}
        run: OSSUTIL=$RUNNER_TEMP/ossutil packaging/oss-publish.sh "${GITHUB_REF_NAME#v}" rel
